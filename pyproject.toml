[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepselligence"
version = "0.1.0"
description = "NEPSE AI Dashboard - Personal stock exchange market intelligence"
authors = [{name = "Aarogya Rijal"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.31",
    "psycopg2-binary==2.9.10",
    "apscheduler==3.10.4",
    "httpx==0.28.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.1",
    "pytz==2024.1",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.24.0",
    "black==24.3.0",
    "ruff==0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
