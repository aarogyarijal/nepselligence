services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: nepselligence-postgres
    environment:
      POSTGRES_USER: nepselligence
      POSTGRES_PASSWORD: nepselligence
      POSTGRES_DB: nepselligence
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=768MB
      -c max_connections=100
      -c wal_buffers=16MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepselligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nepselligence

  # NepseAPI-Unofficial (self-hosted market data)
  nepseapi:
    image: surajrimal/nepseapi:latest
    container_name: nepselligence-nepseapi
    environment:
      # The nepse library signs graph POSTs with date.today().day. In a UTC
      # container that is the wrong day from 00:00 to 05:45 NPT, NEPSE answers
      # 401, the library retries until RecursionError and its token manager
      # deadlocks, hanging every endpoint until the container is restarted.
      TZ: Asia/Kathmandu
    ports:
      - "8000:8000"  # REST API
      - "5555:5555"  # WebSocket
      - "9000:9000"  # MCP server
    healthcheck:
      # The image has no curl. IsNepseOpen (not /health) because it needs a
      # token, so it fails when the token manager is deadlocked.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/IsNepseOpen', timeout=8)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nepselligence
    depends_on:
      postgres:
        condition: service_healthy

  # Backend scheduler + API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nepselligence-backend
    environment:
      DATABASE_URL: postgresql://nepselligence:nepselligence@postgres:5432/nepselligence
      NEPSE_API_URL: http://nepseapi:8000
      SCHEDULER_TIMEZONE: Asia/Kathmandu
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nepseapi:
        condition: service_started
    networks:
      - nepselligence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Next.js frontend dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: nepselligence-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nepselligence
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  nepselligence:
    driver: bridge
